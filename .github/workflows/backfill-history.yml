name: Backfill historical Raspberry Pi kernel modules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.kernel_version }} / ${{ matrix.arch }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        kernel_version:
          - '6.6.20'
          - '6.6.28'
          - '6.6.31'
          - '6.6.47'
          - '6.6.51'
          - '6.6.62'
          - '6.6.74'
          - '6.12.19'
          - '6.12.20'
          - '6.12.25'
          - '6.12.34'
          - '6.12.47'
          - '6.12.62'
          - '6.12.75'
          - '6.12.87'
          - '6.12.93'
          - '6.12.96'
          - '6.12.109'
          - '6.18.29'
          - '6.18.33'
          - '6.18.34'
          - '6.18.39'
          - '6.18.50'
        arch: [arm64, armhf]
        include:
          # Raspberry Pi OS Bookworm's 2023 6.1 series used historical
          # header package prefixes rather than the current <version>+rpt
          # naming. Keep every archived 2023 snapshot grouped by its numeric
          # kernel version in the matching Release.
          - kernel_version: '6.1.21'
            arch: arm64
            header_prefix: 6.1.0-rpi1
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.21'
          - kernel_version: '6.1.21'
            arch: armhf
            header_prefix: 6.1.0-rpi1
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.21'
          - kernel_version: '6.1.47'
            arch: arm64
            header_prefix: 6.1.0-rpi2
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.47'
          - kernel_version: '6.1.47'
            arch: armhf
            header_prefix: 6.1.0-rpi2
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.47'
          - kernel_version: '6.1.54'
            arch: arm64
            header_prefix: 6.1.0-rpi4
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.54'
          - kernel_version: '6.1.54'
            arch: armhf
            header_prefix: 6.1.0-rpi4
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.54'
          - kernel_version: '6.1.58'
            arch: arm64
            header_prefix: 6.1.0-rpi6
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.58'
          - kernel_version: '6.1.58'
            arch: armhf
            header_prefix: 6.1.0-rpi6
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.58'
          - kernel_version: '6.1.63'
            arch: arm64
            header_prefix: 6.1.0-rpi7
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.63'
          - kernel_version: '6.1.63'
            arch: armhf
            header_prefix: 6.1.0-rpi7
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.63'
          - kernel_version: '6.1.73'
            arch: arm64
            header_prefix: 6.1.0-rpi8
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.73'
          - kernel_version: '6.1.73'
            arch: armhf
            header_prefix: 6.1.0-rpi8
            kbuild_package: linux-kbuild-6.1
            release_version: '6.1.73'
    steps:
      - uses: actions/checkout@v4

      - name: Build modules from historical headers
        env:
          IMAGE: ${{ matrix.arch == 'arm64' && 'debian:trixie' || 'arm32v7/debian:trixie' }}
          PLATFORM: ${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/arm/v7' }}
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          MODULE_ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.arch }}
          HEADER_PREFIX: ${{ matrix.header_prefix || '' }}
          KBUILD_PACKAGE: ${{ matrix.kbuild_package || '' }}
          CONFIGS: ${{ matrix.arch == 'arm64' && 'rpi-v8 rpi-2712' || 'rpi-v6 rpi-v7 rpi-v7l' }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -e KERNEL_VERSION -e MODULE_ARCH -e DEB_ARCH -e HEADER_PREFIX -e KBUILD_PACKAGE -e CONFIGS \
            -v "$PWD:/output" -w /tmp "$IMAGE" bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git build-essential bc bison flex libssl-dev libelf-dev kmod
              git clone --depth 1 https://github.com/PiSugar/pisugar-power-manager-rs.git source

              pool=https://archive.raspberrypi.com/debian/pool/main/l/linux
              curl -fsSL "$pool/" -o /tmp/linux-pool.html
              kernel_prefix=${HEADER_PREFIX:-"${KERNEL_VERSION}+rpt"}
              kbuild_package=${KBUILD_PACKAGE:-"linux-kbuild-${kernel_prefix}"}
              packages=""
              download_package() {
                package=$1
                package_arch=$2
                filename=$(grep -F "href=\"${package}_" /tmp/linux-pool.html | sed -n "s/.*href=\"\\([^\"]*\\)\".*/\\1/p" | grep -F "_${package_arch}.deb" | head -n 1 || true)
                if [ -z "$filename" ]; then
                  echo "${package} is unavailable; skipping."
                  return 0
                fi
                curl -fsSLO "$pool/$filename"
                packages="$packages $filename"
              }

              download_package "$kbuild_package" "$DEB_ARCH"
              download_package "linux-headers-${kernel_prefix}-common-rpi" all

              for config in $CONFIGS; do
                download_package "linux-headers-${kernel_prefix}-${config}" "$DEB_ARCH"
              done

              test -n "$packages"
              # Images are not needed to build external modules.  Unpacking
              # avoids pulling each historical kernel image into the runner.
              dpkg --unpack $packages
              for header_dir in /usr/src/linux-headers-"${kernel_prefix}"-rpi-*; do
                utsrelease="$header_dir/include/generated/utsrelease.h"
                [ -f "$utsrelease" ] || continue
                kernel_release=$(cut -d \" -f2 "$utsrelease")
                mkdir -p "/lib/modules/${kernel_release}"
                ln -sfn "$header_dir" "/lib/modules/${kernel_release}/build"
              done
              if [ "$MODULE_ARCH" = arm64 ]; then
                compiler_prefix=aarch64-linux-gnu-
              else
                compiler_prefix=arm-linux-gnueabihf-
              fi
              for version in 10 11 12 13 14 15; do
                ln -sf "$(command -v "${compiler_prefix}gcc")" "/usr/local/bin/${compiler_prefix}gcc-${version}"
                ln -sf "$(command -v gcc)" "/usr/local/bin/gcc-${version}"
              done
              cd source
              bash pisugar-module/build-prebuilt.sh "$MODULE_ARCH" /output/dist
            '

      - name: Publish grouped kernel release assets
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ matrix.release_version || '' }}
        run: |
          shopt -s nullglob
          for asset in dist/pisugar-module_*_"$MODULE_ARCH".tar.gz; do
            abi=${asset#dist/pisugar-module_}
            abi=${abi%_"$MODULE_ARCH".tar.gz}
            kernel_version=${RELEASE_VERSION:-${abi%%+*}}
            tag="kernel-${kernel_version}"
            branch="kernel/${kernel_version}"
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              git push origin "${GITHUB_SHA}:refs/heads/${branch}" || \
                git ls-remote --exit-code --heads origin "$branch" >/dev/null
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target "$branch" --title "PiSugar modules for Linux ${kernel_version}" --notes "Prebuilt PiSugar battery kernel modules for Linux ${kernel_version}." --prerelease --latest=false || \
                gh release view "$tag" >/dev/null
            fi
            gh release upload "$tag" "$asset" --clobber
          done
